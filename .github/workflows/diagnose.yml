name: Auto-Diagnose & Write SOP

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  diagnose:
    name: Claude Diagnosis
    runs-on: ubuntu-latest
    # Only run when CI actually failed
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Fetch failed job logs
        id: logs
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const failedJob = jobs.data.jobs.find(j => j.conclusion === 'failure');
            if (!failedJob) { core.setOutput('error', 'No failed job found'); return; }
            core.setOutput('job_name', failedJob.name);
            const failedStep = failedJob.steps?.find(s => s.conclusion === 'failure');
            core.setOutput('step_name', failedStep?.name ?? 'unknown step');

      - name: Generate SOP via Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GIT_AUTHOR_NAME: "AI DevOps Platform"
          GIT_AUTHOR_EMAIL: "devops-bot@ai-platform.local"
        run: |
          node --import tsx/esm src/infrastructure/mcp/scripts/diagnose-ci.ts \
            --workflow "CI" \
            --job "${{ steps.logs.outputs.job_name }}" \
            --step "${{ steps.logs.outputs.step_name }}" \
            --branch "${{ github.event.workflow_run.head_branch }}" \
            --commit "${{ github.event.workflow_run.head_sha }}" \
            --author "${{ github.event.workflow_run.head_commit.author.name }}" \
            --repo "${{ github.event.workflow_run.repository.html_url }}"
